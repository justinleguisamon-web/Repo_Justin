<!DOCTYPE html>
<html lang="es-ES">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 02 - Texto y encabezados</title>
  </head>

  <body>
    <!-- PRÁCTICA 02: TEXTO Y ENCABEZADOS. Objetivo: utilizar p, br, hr y la jerarquía h1-h6. -->
    <!-- TODO 1: Convierte el texto siguiente en el encabezado principal (h1). -->
    <h1>Guía de mi isla favorita</h1>
    <!-- TODO 2: Convierte "Introducción" en h2 y el texto posterior en un párrafo. -->
    <h2>Introducción</h2>
    <p>En esta página voy a contar algunos lugares que merece la pena conocer.</p>
    <!-- TODO 3: Crea un h2 llamado "Datos rápidos". Debajo, crea UN SOLO párrafo que muestre cada dato en una línea mediante br: Isla: Gran Canaria / Provincia: Las Palmas / País: España -->
    <h2>Datos rápidos</h2>
    <p>
      Isla: Gran Canaria<br>  
      Provincia: Las Palmas<br> 
      País: España<br>

    </p>
    <!-- TODO 4: Añade una línea horizontal para separar las secciones. -->
     <hr>
    <!-- TODO 5: Crea esta jerarquía correctamente: h2 "Lugares", h3 "Playa", h4 "Qué hacer". Añade un párrafo debajo de cada uno. -->
    <h2> Lugares</h2>
    <p> Maspalomas, San Mateo, Arucas</p>
    
    <h3> Playa</h3>
    <p> De el ingles </p>

    <h4> Que hacer</h4>
    <p>Castillos de arena </p>
    <!-- EXPERIMENTO: cambia temporalmente el h1 por h4. Observa el tamaño. ¿Debemos elegir h1-h6 por su tamaño o por la importancia del contenido? Déjalo de nuevo como h1. -->
    <!--Por la importancia de el contenido, no es lo mismo ver un titulo claro y grande que verlo pequeño y con la misma proporcion que un subtitulo-->
    <!-- RETO: Añade una sección "Gastronomía" con h2, dos subsecciones h3, un párrafo en cada una y un hr al terminar. -->
     <hr>
    <h2> Gastronomía</h2>
    <h3></h3>
    <p></p>
    <h3></h3>
    <p></p>
    <hr>
  </body>

</html>
